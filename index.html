<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="«Звуки живої природи» — інтерактивний навчальний проєкт про біоакустику: як утворюються звуки, хто й навіщо їх видає, як людина впливає на природні звукові ландшафти." />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0b0e0c" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Звуки живої природи" />
  <meta property="og:description" content="Навчальний проєкт з біоакустики: птахи, ссавці, комахи, водойми, інфразвук, вплив людини та вікторина." />
  <title>Звуки живої природи — навчальний проєкт з біоакустики</title>
  <link rel="preload" href="style.css" as="style" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <a class="skip-link" href="#main-content">Перейти до змісту</a>

  <!-- ───────── PRELOADER ───────── -->
  <div class="preloader" id="preloader">
    <div class="preloader-content">
      <svg class="preloader-wave" viewBox="0 0 200 60" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path id="wave-path" d="M0 30 Q10 10, 20 30 T40 30 T60 30 T80 30 T100 30 T120 30 T140 30 T160 30 T180 30 T200 30"/>
      </svg>
      <p class="preloader-text">Завантаження звукового ландшафту</p>
    </div>
  </div>

  <!-- ───────── HEADER ───────── -->
  <header class="site-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M4 16c0-3 2.4-5.5 5.5-5.5S15 13 15 16" />
          <path d="M10 16c0-1.4 1-2.6 2.4-2.6S15 14.6 15 16" opacity=".6"/>
          <path d="M17 16c0-2.2 1.8-4 4-4s4 1.8 4 4" opacity=".8"/>
          <circle cx="16" cy="16" r="15" opacity=".25"/>
        </svg>
      </span>
      <span class="brand-text">Звуки живої природи</span>
    </div>

    <div class="header-meta" aria-live="polite">
      <span class="header-count" id="header-count">01 / 12</span>
      <span class="header-divider" aria-hidden="true"></span>
      <span class="header-current" id="header-current">Вступ</span>
    </div>

    <div class="header-actions">
      <button class="icon-btn" id="btn-menu" type="button" aria-label="Відкрити зміст" aria-haspopup="true" aria-expanded="false" aria-controls="menu-panel">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M4 7h16M4 12h16M4 17h10"/>
        </svg>
      </button>
      <button class="icon-btn" id="btn-top" type="button" aria-label="Догори">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19V5M6 11l6-6 6 6"/>
        </svg>
      </button>
    </div>

    <div class="header-progress" aria-hidden="true">
      <span class="header-progress-fill" id="header-progress-fill"></span>
    </div>
  </header>

  <!-- ───────── MAIN / PAGES ───────── -->
  <main class="stage" id="main-content">
    <div class="pages" id="pages">
      <!-- Сторінки генеруються в app.js -->
    </div>
  </main>

  <!-- ───────── NAV ARROWS ───────── -->
  <nav class="nav-rail" aria-label="Навігація розділами">
    <button class="rail-btn rail-btn--prev" id="btn-prev" type="button" aria-label="Попередній розділ">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18L9 12l6-6"/>
      </svg>
      <span class="rail-label">Назад</span>
    </button>
    <button class="rail-btn rail-btn--next" id="btn-next" type="button" aria-label="Наступний розділ">
      <span class="rail-label">Далі</span>
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18l6-6-6-6"/>
      </svg>
    </button>
  </nav>

  <!-- ───────── VERTICAL PROGRESS ───────── -->
  <div class="v-progress" aria-hidden="true">
    <span class="v-progress-track">
      <span class="v-progress-fill" id="v-progress-fill"></span>
    </span>
  </div>

  <!-- ───────── MENU ───────── -->
  <div class="menu-overlay" id="menu-overlay" hidden></div>
  <aside class="menu-panel" id="menu-panel" role="dialog" aria-modal="true" aria-label="Зміст" aria-hidden="true">
    <div class="menu-head">
      <div>
        <p class="menu-eyebrow">Зміст</p>
        <h2 class="menu-title">Дванадцять розділів</h2>
      </div>
      <button class="icon-btn" id="btn-close-menu" type="button" aria-label="Закрити зміст">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
    </div>
    <div class="menu-body">
      <ol class="toc" id="toc"><!-- генерується в app.js --></ol>
    </div>
    <div class="menu-foot">
      <p>Гортайте розділи стрілками ← → або свайпом.</p>
    </div>
  </aside>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
